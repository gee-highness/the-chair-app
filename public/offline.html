<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — The Chair App</title>
  <style>
    body {
      font-family: 'Public Sans', system-ui, sans-serif;
      background: #edefe7;
      color: #14231c;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
      text-align: center;
    }
    .ticket {
      background: #f7f8f2;
      border: 1.5px dashed #a39c86;
      border-radius: 2px;
      padding: 2.5rem;
      max-width: 360px;
    }
    h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
    p { color: #3d4d43; margin: 0; }
  </style>
</head>
<body>
  <div class="ticket">
    <h1>You're offline</h1>
    <p>This page needs a connection. Reconnect and try again.</p>
  </div>
</body>
</html>
