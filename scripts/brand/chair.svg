<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The Chair App mark: a barber's chair in profile, facing right.
       Source of truth for every icon: run scripts/brand/build-icons.mjs. -->
  <!-- soft copper halo behind the chair -->
  <circle cx="256" cy="262" r="168" fill="url(#halo)"/>
  <g fill="url(#cu)" stroke="url(#cu)" stroke-linejoin="round" stroke-linecap="round">
    <!-- headrest + neck -->
    <path d="M214 112 L268 104" stroke-width="40" fill="none"/>
    <path d="M238 126 L242 150" stroke-width="16" fill="none"/>
    <!-- reclined backrest -->
    <path d="M208 164 L270 154 L302 290 L234 302 Z" stroke-width="26"/>
    <!-- seat cushion -->
    <path d="M168 326 L376 322" stroke-width="50" fill="none"/>
    <!-- armrest and post -->
    <path d="M300 256 L384 246" stroke-width="20" fill="none"/>
    <path d="M338 256 L340 298" stroke-width="14" fill="none"/>
    <!-- gas lift with collar -->
    <path d="M256 346 L256 410" stroke-width="32" fill="none"/>
    <path d="M232 372 L280 372" stroke-width="12" fill="none"/>
    <!-- footed base -->
    <path d="M160 440 Q256 402 352 440" stroke-width="24" fill="none"/>
  </g>
  <!-- stitching on the backrest -->
  <path d="M230 186 L262 181 M236 214 L270 209 M243 242 L277 237" stroke="#fff" stroke-opacity="0.34" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 14" fill="none"/>
  <!-- seat highlight -->
  <path d="M184 312 L360 309" stroke="#fff" stroke-opacity="0.28" stroke-width="6" stroke-linecap="round" fill="none"/>
</svg>
