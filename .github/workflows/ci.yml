# Runs on every pull request and on pushes to main: type-check, unit tests and a
# production build. Playwright end-to-end tests are not included; they need a
# database (see playwright.config.ts).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholder: the app only connects when a request needs the database,
      # and unit tests use an in-memory fake. Building needs the variable to exist.
      MONGODB_URI: mongodb://localhost:27017/chair-app-ci
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
